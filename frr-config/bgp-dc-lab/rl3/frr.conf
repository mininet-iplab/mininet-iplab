frr version 10.5.0
frr defaults traditional
log syslog informational
no ipv6 forwarding
hostname rl3
!
router bgp 65003
 bgp router-id 172.16.3.1
 no bgp ebgp-requires-policy
 no bgp enforce-first-as
 bgp bestpath as-path multipath-relax
 neighbor 10.11.3.1 remote-as 65000
 neighbor 10.11.3.1 description SPINE-1
 neighbor 10.12.3.1 remote-as 65000
 neighbor 10.12.3.1 description SPINE-2
 !
 address-family ipv4 unicast
  network 172.16.3.0/24
  maximum-paths 64
 exit-address-family
exit
!
