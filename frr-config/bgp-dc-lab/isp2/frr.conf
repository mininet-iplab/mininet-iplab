frr version 10.5.0
frr defaults traditional
log syslog informational
no ipv6 forwarding
hostname isp2
!
interface lo
 ip address 2.2.2.2/32
 ip address 9.9.9.9/32
exit
!
ip route 2.2.2.0/24 Null0
ip route 9.9.9.0/24 Null0
!
router bgp 64513
 bgp router-id 2.2.2.2
 no bgp ebgp-requires-policy
 no bgp enforce-first-as
 neighbor 10.102.1.2 remote-as 65000
 neighbor 10.102.1.2 description SPINE-1
 neighbor 10.102.2.2 remote-as 65000
 neighbor 10.102.2.2 description SPINE-2
 !
 address-family ipv4 unicast
  network 2.2.2.0/24
  network 9.9.9.0/24
  neighbor 10.102.1.2 next-hop-self
  neighbor 10.102.2.2 next-hop-self
 exit-address-family
exit
!
