frr version 10.5.0
frr defaults traditional
log syslog informational
no ipv6 forwarding
hostname isp1
!
interface lo
 ip address 1.1.1.1/32
 ip address 8.8.8.8/32
exit
!
ip route 1.1.1.0/24 Null0
ip route 8.8.8.0/24 Null0
!
router bgp 64512
 bgp router-id 1.1.1.1
 no bgp ebgp-requires-policy
 no bgp enforce-first-as
 neighbor 10.101.1.2 remote-as 65000
 neighbor 10.101.1.2 description SPINE-1
 neighbor 10.101.2.2 remote-as 65000
 neighbor 10.101.2.2 description SPINE-2
 !
 address-family ipv4 unicast
  network 1.1.1.0/24
  network 8.8.8.0/24
  neighbor 10.101.1.2 next-hop-self
  neighbor 10.101.2.2 next-hop-self
 exit-address-family
exit
!
