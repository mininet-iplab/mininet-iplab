frr version 10.5.0
frr defaults traditional
log syslog informational
no ipv6 forwarding
hostname rl2
!
router bgp 65002
 bgp router-id 172.16.2.1
 no bgp ebgp-requires-policy
 no bgp enforce-first-as
 bgp bestpath as-path multipath-relax
 neighbor 10.11.2.1 remote-as 65000
 neighbor 10.11.2.1 description SPINE-1
 neighbor 10.12.2.1 remote-as 65000
 neighbor 10.12.2.1 description SPINE-2
 !
 address-family ipv4 unicast
  network 172.16.2.0/24
  maximum-paths 64
 exit-address-family
exit
!
