frr version 10.5.0
frr defaults traditional
log syslog informational
no ipv6 forwarding
hostname rs2
!
ip prefix-list PL-DC-INTERNAL seq 5 permit 172.16.0.0/16 ge 24
!
route-map RM-DC-OUT permit 10
 match ip address prefix-list PL-DC-INTERNAL
exit
!
vrf vrf-ext
 vni 10
exit-vrf
!
router bgp 65000
 bgp router-id 10.255.0.2
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax
 neighbor 10.12.1.2 remote-as 65001
 neighbor 10.12.1.2 description LEAF-1
 neighbor 10.12.2.2 remote-as 65002
 neighbor 10.12.2.2 description LEAF-2
 neighbor 10.12.3.2 remote-as 65003
 neighbor 10.12.3.2 description LEAF-3
 !
 address-family ipv4 unicast
  maximum-paths 64
  import vrf vrf-ext
 exit-address-family
exit
!
router bgp 65000 vrf vrf-ext
 bgp router-id 10.255.0.2
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax
 neighbor 10.101.2.1 remote-as 64512
 neighbor 10.101.2.1 description ISP-1
 neighbor 10.102.2.1 remote-as 64513
 neighbor 10.102.2.1 description ISP-2
 !
 address-family ipv4 unicast
  neighbor 10.101.2.1 route-map RM-DC-OUT out
  neighbor 10.102.2.1 route-map RM-DC-OUT out
  maximum-paths 64
  import vrf default
 exit-address-family
exit
!
