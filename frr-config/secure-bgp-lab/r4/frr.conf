frr version 10.7.1
frr defaults traditional
hostname r4
service integrated-vtysh-config
!
ip route 10.4.0.0/24 blackhole
!
ip prefix-list OWN_NET seq 5 permit 10.4.0.0/24
!
route-map TO-UPSTREAM permit 10
 match ip address prefix-list OWN_NET
exit
!
router bgp 65004
 bgp router-id 10.0.14.2
 no bgp ebgp-requires-policy
 neighbor 10.0.14.1 remote-as 65001
 neighbor 10.0.14.1 description r1 (AS65001, provider)
 neighbor 10.0.14.1 timers 3 9
 neighbor 10.0.24.1 remote-as 65002
 neighbor 10.0.24.1 description r2 (AS65002, provider)
 neighbor 10.0.24.1 timers 3 9
 !
 address-family ipv4 unicast
  network 10.4.0.0/24
  neighbor 10.0.14.1 route-map TO-UPSTREAM out
  neighbor 10.0.24.1 route-map TO-UPSTREAM out
 exit-address-family
exit
!
