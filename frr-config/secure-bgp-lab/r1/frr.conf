frr version 10.7.1
frr defaults traditional
hostname r1
service integrated-vtysh-config
!
ip route 10.1.0.0/24 blackhole
!
ip prefix-list OWN_NET seq 5 permit 10.1.0.0/24
!
route-map FROM-PEER permit 10
exit
!
route-map FROM-CUSTOMER permit 10
 set local-preference 200
exit
!
route-map TO-ALL permit 10
exit
!
router bgp 65001
 bgp router-id 10.0.12.1
 no bgp ebgp-requires-policy
 bgp bestpath compare-routerid
 neighbor 10.0.12.2 remote-as 65002
 neighbor 10.0.12.2 description r2 (AS65002, peer)
 neighbor 10.0.12.2 timers 3 9
 neighbor 10.0.13.2 remote-as 65003
 neighbor 10.0.13.2 description sp1 (AS65003, peer)
 neighbor 10.0.13.2 timers 3 9
 neighbor 10.0.14.2 remote-as 65004
 neighbor 10.0.14.2 description r4 (AS65004, customer)
 neighbor 10.0.14.2 timers 3 9
 !
 address-family ipv4 unicast
  network 10.1.0.0/24
  neighbor 10.0.12.2 soft-reconfiguration inbound
  neighbor 10.0.12.2 route-map FROM-PEER in
  neighbor 10.0.12.2 route-map TO-ALL out
  neighbor 10.0.13.2 soft-reconfiguration inbound
  neighbor 10.0.13.2 route-map FROM-PEER in
  neighbor 10.0.13.2 route-map TO-ALL out
  neighbor 10.0.14.2 soft-reconfiguration inbound
  neighbor 10.0.14.2 route-map FROM-CUSTOMER in
  neighbor 10.0.14.2 route-map TO-ALL out
 exit-address-family
exit
!
