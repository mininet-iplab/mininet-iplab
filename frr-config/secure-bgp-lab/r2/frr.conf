frr version 10.7.1
frr defaults traditional
hostname r2
service integrated-vtysh-config
!
router bgp 65002
 bgp router-id 10.0.24.1
 no bgp ebgp-requires-policy
 neighbor 10.0.12.1 remote-as 65001
 neighbor 10.0.12.1 description r1 (AS65001, peer)
 neighbor 10.0.12.1 timers 3 9
 neighbor 10.0.24.2 remote-as 65004
 neighbor 10.0.24.2 description r4 (AS65004, customer)
 neighbor 10.0.24.2 timers 3 9
 !
 address-family ipv4 unicast
  network 10.2.0.0/24
 exit-address-family
exit
!
