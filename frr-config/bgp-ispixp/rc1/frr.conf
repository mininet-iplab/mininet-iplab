hostname rc1
service integrated-vtysh-config

!
! ============================================================================
! RC1 - Customer Router (AS 45705)
! Connected to: RP1 (upstream ISP)
! ============================================================================
!

!
! Route policies
!
route-map RM_ISP_IN permit 10
 set local-preference 100
exit

route-map RM_ISP_OUT permit 10
exit

!
router bgp 45705
 bgp router-id 192.0.2.31
 neighbor 10.0.11.1 remote-as 7713
 neighbor 10.0.11.1 description rp1
 !
 address-family ipv4 unicast
  network 10.10.1.0/24
  !
  neighbor 10.0.11.1 route-map RM_ISP_IN in
  neighbor 10.0.11.1 route-map RM_ISP_OUT out
  neighbor 10.0.11.1 soft-reconfiguration inbound
 exit-address-family
exit

!
line vty
exit

!

