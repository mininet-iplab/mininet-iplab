hostname rc4
service integrated-vtysh-config

!
! ============================================================================
! RC4 - Customer Router (AS 3382)
! Connected to: RP2 (upstream ISP)
! ============================================================================
!

!
! Route policies
!
route-map RM_ISP_IN permit 10
 set local-preference 100
exit

route-map RM_ISP_OUT permit 10
exit

!
router bgp 3382
 bgp router-id 192.0.2.34
 neighbor 10.0.14.1 remote-as 4761
 neighbor 10.0.14.1 description rp2
 !
 address-family ipv4 unicast
  network 10.10.4.0/24
  !
  neighbor 10.0.14.1 route-map RM_ISP_IN in
  neighbor 10.0.14.1 route-map RM_ISP_OUT out
  neighbor 10.0.14.1 soft-reconfiguration inbound
 exit-address-family
exit

!
line vty
exit

!

