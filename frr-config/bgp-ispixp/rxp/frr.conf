hostname rxp
service integrated-vtysh-config

!
! ============================================================================
! RXP - IXP Route-Server (AS 7717)
! Connected to: RP1, RP2 (route participants only)
! Route-server clients: RP1, RP2 (automatic route reflection)
! ============================================================================
!

! Communities: tag routes by source
bgp community-list standard CL_PARTICIPANT permit 7717:2000

!
! Inbound policies
!

! From participants: accept and tag
route-map RM_PARTICIPANT_IN permit 10
 set local-preference 150
 set community 7717:2000 additive
exit

!
! Outbound policies
!

! To participants: reflect all routes with RXP as next-hop
route-map RM_PARTICIPANT_OUT permit 10
 set ip next-hop peer-address
exit

!
router bgp 7717
 bgp router-id 192.0.2.1
 neighbor 10.0.1.2 remote-as 7713
 neighbor 10.0.1.2 description rp1
 neighbor 10.0.2.2 remote-as 4761
 neighbor 10.0.2.2 description rp2
 !
 address-family ipv4 unicast
  !
  neighbor 10.0.1.2 activate
  neighbor 10.0.1.2 route-map RM_PARTICIPANT_IN in
  neighbor 10.0.1.2 route-map RM_PARTICIPANT_OUT out
  neighbor 10.0.1.2 soft-reconfiguration inbound
  !
  neighbor 10.0.2.2 activate
  neighbor 10.0.2.2 route-map RM_PARTICIPANT_IN in
  neighbor 10.0.2.2 route-map RM_PARTICIPANT_OUT out
  neighbor 10.0.2.2 soft-reconfiguration inbound
 exit-address-family
exit

!
line vty
exit

!

