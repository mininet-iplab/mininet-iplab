hostname rp2
service integrated-vtysh-config

!
! ============================================================================
! RP2 - ISP Route Participant (AS 4761)
! Connected to: RXP (IXP), UP2 (upstream), RC3/RC4 (customers)
! ============================================================================
!

! Communities: tag routes by source
bgp community-list standard CL_UPSTREAM permit 4761:1000
bgp community-list standard CL_CUSTOMER permit 4761:2000
bgp community-list standard CL_IXP permit 4761:3000

!
! Inbound policies
!
route-map RM_IXP_IN permit 10
 set local-preference 200
 set community 4761:3000 additive
exit

route-map RM_UPSTREAM_IN permit 10
 set local-preference 100
 set community 4761:1000 additive
exit

route-map RM_CUSTOMER_IN permit 10
 set local-preference 300
 set community 4761:2000 additive
exit

!
! Outbound policies
!

! To RXP: send own routes and customer routes only
route-map RM_IXP_OUT deny 10
 match community CL_UPSTREAM
exit
route-map RM_IXP_OUT deny 20
 match community CL_IXP
exit
route-map RM_IXP_OUT permit 30
exit

! To UP2: send customer routes only (no upstream transit)
route-map RM_UPSTREAM_OUT deny 10
 match community CL_UPSTREAM
exit
route-map RM_UPSTREAM_OUT deny 20
 match community CL_IXP
exit
route-map RM_UPSTREAM_OUT permit 30
exit

! To customers: send all routes (upstream + IXP + customer)
route-map RM_CUSTOMER_OUT permit 10
exit

!
router bgp 4761
 bgp router-id 192.0.2.12
 neighbor 10.0.2.1 remote-as 7717
 neighbor 10.0.2.1 description rxp
 neighbor 10.0.4.1 remote-as 9002
 neighbor 10.0.4.1 description up2
 neighbor 10.0.13.2 remote-as 4796
 neighbor 10.0.13.2 description rc3
 neighbor 10.0.14.2 remote-as 3382
 neighbor 10.0.14.2 description rc4
 !
 address-family ipv4 unicast
  network 10.200.2.0/24
  !
  neighbor 10.0.2.1 route-map RM_IXP_IN in
  neighbor 10.0.2.1 route-map RM_IXP_OUT out
  neighbor 10.0.2.1 soft-reconfiguration inbound
  !
  neighbor 10.0.4.1 route-map RM_UPSTREAM_IN in
  neighbor 10.0.4.1 route-map RM_UPSTREAM_OUT out
  neighbor 10.0.4.1 soft-reconfiguration inbound
  !
  neighbor 10.0.13.2 route-map RM_CUSTOMER_IN in
  neighbor 10.0.13.2 route-map RM_CUSTOMER_OUT out
  neighbor 10.0.13.2 soft-reconfiguration inbound
  neighbor 10.0.14.2 route-map RM_CUSTOMER_IN in
  neighbor 10.0.14.2 route-map RM_CUSTOMER_OUT out
  neighbor 10.0.14.2 soft-reconfiguration inbound
 exit-address-family
exit

!
line vty
exit

!

