hostname rp1
service integrated-vtysh-config

!
! ============================================================================
! RP1 - ISP Route Participant (AS 7713)
! Connected to: RXP (IXP), UP1 (upstream), RC1/RC2 (customers)
! ============================================================================
!

! Communities: tag routes by source
bgp community-list standard CL_UPSTREAM permit 7713:1000
bgp community-list standard CL_CUSTOMER permit 7713:2000
bgp community-list standard CL_IXP permit 7713:3000

!
! Inbound policies
!
route-map RM_IXP_IN permit 10
 set local-preference 200
 set community 7713:3000 additive
exit

route-map RM_UPSTREAM_IN permit 10
 set local-preference 100
 set community 7713:1000 additive
exit

route-map RM_CUSTOMER_IN permit 10
 set local-preference 300
 set community 7713:2000 additive
exit

!
! Outbound policies
!

! To RXP: send own routes and customer routes only
route-map RM_IXP_OUT deny 10
 match community CL_UPSTREAM
exit
route-map RM_IXP_OUT deny 20
 match community CL_IXP
exit
route-map RM_IXP_OUT permit 30
exit

! To UP1: send customer routes only (no upstream transit)
route-map RM_UPSTREAM_OUT deny 10
 match community CL_UPSTREAM
exit
route-map RM_UPSTREAM_OUT deny 20
 match community CL_IXP
exit
route-map RM_UPSTREAM_OUT permit 30
exit

! To customers: send all routes (upstream + IXP + customer)
route-map RM_CUSTOMER_OUT permit 10
exit

!
router bgp 7713
 bgp router-id 192.0.2.11
 neighbor 10.0.1.1 remote-as 7717
 neighbor 10.0.1.1 description rxp
 neighbor 10.0.3.2 remote-as 4788
 neighbor 10.0.3.2 description up1
 neighbor 10.0.11.2 remote-as 45705
 neighbor 10.0.11.2 description rc1
 neighbor 10.0.12.2 remote-as 46019
 neighbor 10.0.12.2 description rc2
 !
 address-family ipv4 unicast
  network 10.200.1.0/24
  !
  neighbor 10.0.1.1 route-map RM_IXP_IN in
  neighbor 10.0.1.1 route-map RM_IXP_OUT out
  neighbor 10.0.1.1 soft-reconfiguration inbound
  !
  neighbor 10.0.3.2 route-map RM_UPSTREAM_IN in
  neighbor 10.0.3.2 route-map RM_UPSTREAM_OUT out
  neighbor 10.0.3.2 soft-reconfiguration inbound
  !
  neighbor 10.0.11.2 route-map RM_CUSTOMER_IN in
  neighbor 10.0.11.2 route-map RM_CUSTOMER_OUT out
  neighbor 10.0.11.2 soft-reconfiguration inbound
  neighbor 10.0.12.2 route-map RM_CUSTOMER_IN in
  neighbor 10.0.12.2 route-map RM_CUSTOMER_OUT out
  neighbor 10.0.12.2 soft-reconfiguration inbound
 exit-address-family
exit

!
line vty
exit

!

