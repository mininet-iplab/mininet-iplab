frr version 10.5.1
frr defaults traditional
hostname mininet-iplab
hostname up2
service integrated-vtysh-config
!
route-map RM_UPSTREAM_TR1_IN permit 10
 set community 9002:1000 additive
 set local-preference 100
exit
!
route-map RM_UPSTREAM_TR2_IN permit 10
 set community 9002:1001 additive
 set local-preference 150
exit
!
route-map RM_CUSTOMER_IN permit 10
 set community 9002:2000 additive
 set local-preference 300
exit
!
route-map RM_PEER_UP1_IN permit 10
 set community 9002:3000 additive
 set local-preference 200
exit
!
route-map RM_UPSTREAM_OUT_TR1 deny 10
 match community CL_UPSTREAM_TR2
exit
!
route-map RM_UPSTREAM_OUT_TR1 deny 20
 match community CL_UPSTREAM_TR1
exit
!
route-map RM_UPSTREAM_OUT_TR1 deny 30
 match community CL_PEER_UP1
exit
!
route-map RM_UPSTREAM_OUT_TR1 permit 40
 match community CL_CUSTOMER
exit
!
route-map RM_UPSTREAM_OUT_TR1 permit 50
exit
!
route-map RM_UPSTREAM_OUT_TR2 deny 10
 match community CL_UPSTREAM_TR1
exit
!
route-map RM_UPSTREAM_OUT_TR2 deny 20
 match community CL_UPSTREAM_TR2
exit
!
route-map RM_UPSTREAM_OUT_TR2 deny 30
 match community CL_PEER_UP1
exit
!
route-map RM_UPSTREAM_OUT_TR2 permit 40
 match community CL_CUSTOMER
exit
!
route-map RM_UPSTREAM_OUT_TR2 permit 50
exit
!
route-map RM_CUSTOMER_OUT permit 10
exit
!
route-map RM_PEER_UP1_OUT deny 10
 match community CL_UPSTREAM_TR1
exit
!
route-map RM_PEER_UP1_OUT deny 20
 match community CL_UPSTREAM_TR2
exit
!
route-map RM_PEER_UP1_OUT deny 30
 match community CL_PEER_UP1
exit
!
route-map RM_PEER_UP1_OUT permit 40
 match community CL_CUSTOMER
exit
!
route-map RM_PEER_UP1_OUT permit 50
exit
!
router bgp 9002
 bgp router-id 192.0.2.22
 neighbor 10.0.4.2 remote-as 4761
 neighbor 10.0.4.2 description rp2
 neighbor 10.0.6.2 remote-as 3356
 neighbor 10.0.6.2 description tr1
 neighbor 10.0.8.2 remote-as 1299
 neighbor 10.0.8.2 description tr2
 neighbor 10.0.9.1 remote-as 4788
 neighbor 10.0.9.1 description up1
 !
 address-family ipv4 unicast
  network 10.100.2.0/24
  neighbor 10.0.4.2 default-originate route-map RM_CUSTOMER_OUT
  neighbor 10.0.4.2 route-map RM_CUSTOMER_IN in
  neighbor 10.0.4.2 route-map RM_CUSTOMER_OUT out
  neighbor 10.0.6.2 route-map RM_UPSTREAM_TR1_IN in
  neighbor 10.0.6.2 route-map RM_UPSTREAM_OUT_TR1 out
  neighbor 10.0.8.2 route-map RM_UPSTREAM_TR2_IN in
  neighbor 10.0.8.2 route-map RM_UPSTREAM_OUT_TR2 out
  neighbor 10.0.9.1 route-map RM_PEER_UP1_IN in
  neighbor 10.0.9.1 route-map RM_PEER_UP1_OUT out
 exit-address-family
exit
!
bgp community-list standard CL_CUSTOMER seq 5 permit 9002:2000
bgp community-list standard CL_PEER_UP1 seq 5 permit 9002:3000
bgp community-list standard CL_UPSTREAM_TR1 seq 5 permit 9002:1000
bgp community-list standard CL_UPSTREAM_TR2 seq 5 permit 9002:1001
!
