frr version 10.5.0
frr defaults traditional
hostname r3
service integrated-vtysh-config
!
ip prefix-list PREFIX_FROM_EBGP seq 5 permit 0.0.0.0/0 le 24
!
route-map IMPORT_EBGP permit 5
 match ip address prefix-list PREFIX_FROM_EBGP
exit
!
route-map EXPORT_EBGP permit 5
 match ip address prefix-list PREFIX_FROM_EBGP
exit
!
router bgp 65002
 bgp router-id 10.10.0.6
 no bgp default ipv4-unicast
 neighbor 10.10.0.9 remote-as 65002
 neighbor 10.10.0.9 description R2
 neighbor 10.10.0.5 remote-as 65001
 neighbor 10.10.0.5 description R1
 neighbor 10.10.0.18 remote-as 65003
 neighbor 10.10.0.18 description R4
 !
 address-family ipv4 unicast
  neighbor 10.10.0.9 activate
  neighbor 10.10.0.9 next-hop-self
  neighbor 10.10.0.9 soft-reconfiguration inbound
  neighbor 10.10.0.5 activate
  neighbor 10.10.0.5 soft-reconfiguration inbound
  neighbor 10.10.0.5 route-map IMPORT_EBGP in
  neighbor 10.10.0.5 route-map EXPORT_EBGP out
  neighbor 10.10.0.18 activate
  neighbor 10.10.0.18 soft-reconfiguration inbound
  neighbor 10.10.0.18 route-map EXPORT_EBGP in
  neighbor 10.10.0.18 route-map IMPORT_EBGP out
 exit-address-family
exit
!
