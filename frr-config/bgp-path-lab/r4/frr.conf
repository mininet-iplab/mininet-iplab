frr version 10.5.0
frr defaults traditional
hostname r4
service integrated-vtysh-config
!
ip prefix-list CUST_NET seq 5 permit 192.168.2.0/24
ip prefix-list CUST_NET seq 10 permit 192.168.3.0/24
ip prefix-list PREFIX_FROM_EBGP seq 5 permit 0.0.0.0/0 le 24
!
route-map EXPORT_EBGP permit 10
 match ip address prefix-list CUST_NET
exit
!
route-map IMPORT_EBGP permit 10
 match ip address prefix-list PREFIX_FROM_EBGP
exit
!
router bgp 65003
 bgp router-id 10.10.0.14
 no bgp default ipv4-unicast
 neighbor 10.10.0.13 remote-as 65002
 neighbor 10.10.0.13 description R2
 neighbor 10.10.0.17 remote-as 65002
 neighbor 10.10.0.17 description R3
 !
 address-family ipv4 unicast
  network 192.168.2.0/24
  network 192.168.3.0/24
  neighbor 10.10.0.13 activate
  neighbor 10.10.0.13 soft-reconfiguration inbound
  neighbor 10.10.0.13 route-map IMPORT_EBGP in
  neighbor 10.10.0.13 route-map EXPORT_EBGP out
  neighbor 10.10.0.17 activate
  neighbor 10.10.0.17 soft-reconfiguration inbound
  neighbor 10.10.0.17 route-map IMPORT_EBGP in
  neighbor 10.10.0.17 route-map EXPORT_EBGP out
  maximum-paths 1
 exit-address-family
exit
!
