frr version 10.5.0
frr defaults traditional
hostname r2
service integrated-vtysh-config
!
ip prefix-list PREFIX_FROM_EBGP seq 5 permit 0.0.0.0/0 le 24
!
route-map IMPORT_EBGP permit 5
 match ip address prefix-list PREFIX_FROM_EBGP
exit
!
route-map EXPORT_EBGP permit 5
 match ip address prefix-list PREFIX_FROM_EBGP
exit
!
router bgp 65002
 bgp router-id 10.10.0.2
 no bgp default ipv4-unicast
 neighbor 10.10.0.10 remote-as 65002
 neighbor 10.10.0.10 description R3
 neighbor 10.10.0.1 remote-as 65001
 neighbor 10.10.0.1 description R1
 neighbor 10.10.0.14 remote-as 65003
 neighbor 10.10.0.14 description R4
 !
 address-family ipv4 unicast
  neighbor 10.10.0.1 activate
  neighbor 10.10.0.1 soft-reconfiguration inbound
  neighbor 10.10.0.1 route-map IMPORT_EBGP in
  neighbor 10.10.0.1 route-map EXPORT_EBGP out
  neighbor 10.10.0.10 activate
  neighbor 10.10.0.10 next-hop-self
  neighbor 10.10.0.10 soft-reconfiguration inbound
  neighbor 10.10.0.14 activate
  neighbor 10.10.0.14 soft-reconfiguration inbound
  neighbor 10.10.0.14 route-map EXPORT_EBGP in
  neighbor 10.10.0.14 route-map IMPORT_EBGP out
 exit-address-family
exit
!
