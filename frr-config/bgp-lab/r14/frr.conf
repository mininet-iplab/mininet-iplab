frr version 8.5.4
frr defaults traditional
hostname r14
service integrated-vtysh-config
!
ip prefix-list AS65001-NETWORKS permit 172.16.1.0/24
ip prefix-list CLIENT-NETWORKS permit 0.0.0.0/0 le 24
!
route-map EXPORT-TO-EBGP permit 10
 match ip address prefix-list CLIENT-NETWORKS
exit
!
route-map IMPORT-FROM-EBGP permit 10
 match ip address prefix-list CLIENT-NETWORKS
 set local-preference 100
exit
!
router ospf
 ospf router-id 172.16.1.14
 network 172.16.1.14/32 area 0
 network 10.1.1.0/30 area 0
 network 10.1.3.0/30 area 0
exit
!
interface r14-eth0
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 3
exit
!
interface r14-eth1
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 3
exit
!
router bgp 65001
 bgp router-id 172.16.1.14
 timers bgp 1 3
 no bgp default ipv4-unicast
 neighbor 172.16.1.11 remote-as 65001
 neighbor 172.16.1.11 update-source lo
 neighbor 172.16.1.11 timers connect 1
 neighbor 172.16.1.12 remote-as 65001
 neighbor 172.16.1.12 update-source lo
 neighbor 172.16.1.12 timers connect 1
 neighbor 172.16.1.13 remote-as 65001
 neighbor 172.16.1.13 update-source lo
 neighbor 172.16.1.13 timers connect 1
 neighbor 10.0.3.2 remote-as 65002
 neighbor 10.0.3.2 timers connect 1
 neighbor 10.0.3.2 advertisement-interval 0
 !
 address-family ipv4 unicast
  neighbor 172.16.1.11 activate
  neighbor 172.16.1.11 next-hop-self
  neighbor 172.16.1.12 activate
  neighbor 172.16.1.12 next-hop-self
  neighbor 172.16.1.13 activate
  neighbor 172.16.1.13 next-hop-self
  neighbor 10.0.3.2 activate
  neighbor 10.0.3.2 soft-reconfiguration inbound
  neighbor 10.0.3.2 route-map IMPORT-FROM-EBGP in
  neighbor 10.0.3.2 route-map EXPORT-TO-EBGP out
 exit-address-family
exit
!
