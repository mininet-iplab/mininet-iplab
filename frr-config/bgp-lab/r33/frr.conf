frr version 8.5.4
frr defaults traditional
hostname r33
service integrated-vtysh-config
!
router ospf
 ospf router-id 172.18.1.33
 network 172.18.1.33/32 area 0
 network 10.3.3.0/30 area 0
 network 10.3.4.0/30 area 0
 network 172.18.1.0/24 area 0
exit
!
interface r33-eth1
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 3
exit
!
interface r33-eth2
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 3
exit
!
router bgp 65003
 bgp router-id 172.18.1.33
 timers bgp 1 3
 no bgp default ipv4-unicast
 neighbor 172.18.1.31 remote-as 65003
 neighbor 172.18.1.31 update-source lo
 neighbor 172.18.1.31 timers connect 1
 neighbor 172.18.1.32 remote-as 65003
 neighbor 172.18.1.32 update-source lo
 neighbor 172.18.1.32 timers connect 1
 neighbor 172.18.1.34 remote-as 65003
 neighbor 172.18.1.34 update-source lo
 neighbor 172.18.1.34 timers connect 1
 !
 address-family ipv4 unicast
  neighbor 172.18.1.31 activate
  neighbor 172.18.1.32 activate
  neighbor 172.18.1.34 activate
  network 172.18.1.0/24
 exit-address-family
exit
!
