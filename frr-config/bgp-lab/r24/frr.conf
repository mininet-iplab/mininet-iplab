frr version 8.5.4
frr defaults traditional
hostname r24
service integrated-vtysh-config
!
router ospf
 ospf router-id 172.17.1.24
 network 172.17.1.24/32 area 0
 network 10.2.2.0/30 area 0
 network 10.2.3.0/30 area 0
exit
!
interface r24-eth0
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 3
exit
!
interface r24-eth1
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 3
exit
!
router bgp 65002
 bgp router-id 172.17.1.24
 timers bgp 1 3
 no bgp default ipv4-unicast
 neighbor 172.17.1.21 remote-as 65002
 neighbor 172.17.1.21 update-source lo
 neighbor 172.17.1.21 timers connect 1
 neighbor 172.17.1.22 remote-as 65002
 neighbor 172.17.1.22 update-source lo
 neighbor 172.17.1.22 timers connect 1
 neighbor 172.17.1.23 remote-as 65002
 neighbor 172.17.1.23 update-source lo
 neighbor 172.17.1.23 timers connect 1
 !
 address-family ipv4 unicast
  neighbor 172.17.1.21 activate
  neighbor 172.17.1.22 activate
  neighbor 172.17.1.23 activate
 exit-address-family
exit
!
