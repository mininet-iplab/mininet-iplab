frr version 8.5.4
frr defaults traditional
hostname r23
service integrated-vtysh-config
!
ip prefix-list AS65002-NETWORKS permit 172.17.1.0/24
ip prefix-list CLIENT-NETWORKS permit 0.0.0.0/0 le 24
!
route-map EXPORT-TO-EBGP permit 10
 match ip address prefix-list CLIENT-NETWORKS
exit
!
route-map IMPORT-FROM-EBGP permit 10
 match ip address prefix-list CLIENT-NETWORKS
 set local-preference 100
exit
!
router ospf
 ospf router-id 172.17.1.23
 network 172.17.1.23/32 area 0
 network 10.2.3.0/30 area 0
 network 10.2.4.0/30 area 0
exit
!
interface r23-eth0
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 3
exit
!
interface r23-eth1
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 3
exit
!
router bgp 65002
 bgp router-id 172.17.1.23
 timers bgp 1 3
 no bgp default ipv4-unicast
 neighbor 172.17.1.21 remote-as 65002
 neighbor 172.17.1.21 update-source lo
 neighbor 172.17.1.21 timers connect 1
 neighbor 172.17.1.22 remote-as 65002
 neighbor 172.17.1.22 update-source lo
 neighbor 172.17.1.22 timers connect 1
 neighbor 172.17.1.24 remote-as 65002
 neighbor 172.17.1.24 update-source lo
 neighbor 172.17.1.24 timers connect 1
 neighbor 10.0.2.1 remote-as 65003
 neighbor 10.0.2.1 timers connect 1
 neighbor 10.0.2.1 advertisement-interval 0
 !
 address-family ipv4 unicast
  neighbor 172.17.1.21 activate
  neighbor 172.17.1.21 next-hop-self
  neighbor 172.17.1.22 activate
  neighbor 172.17.1.22 next-hop-self
  neighbor 172.17.1.24 activate
  neighbor 172.17.1.24 next-hop-self
  neighbor 10.0.2.1 activate
  neighbor 10.0.2.1 soft-reconfiguration inbound
  neighbor 10.0.2.1 route-map IMPORT-FROM-EBGP in
  neighbor 10.0.2.1 route-map EXPORT-TO-EBGP out
 exit-address-family
exit
!
