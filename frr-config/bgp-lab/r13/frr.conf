frr version 8.5.4
frr defaults traditional
hostname r13
service integrated-vtysh-config
!
router ospf
 ospf router-id 172.16.1.13
 network 172.16.1.13/32 area 0
 network 10.1.3.0/30 area 0
 network 10.1.4.0/30 area 0
exit
!
interface r13-eth0
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 3
exit
!
interface r13-eth1
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 3
exit
!
router bgp 65001
 bgp router-id 172.16.1.13
 timers bgp 1 3
 no bgp default ipv4-unicast
 neighbor 172.16.1.11 remote-as 65001
 neighbor 172.16.1.11 update-source lo
 neighbor 172.16.1.11 timers connect 1
 neighbor 172.16.1.12 remote-as 65001
 neighbor 172.16.1.12 update-source lo
 neighbor 172.16.1.12 timers connect 1
 neighbor 172.16.1.14 remote-as 65001
 neighbor 172.16.1.14 update-source lo
 neighbor 172.16.1.14 timers connect 1
 !
 address-family ipv4 unicast
  neighbor 172.16.1.11 activate
  neighbor 172.16.1.12 activate
  neighbor 172.16.1.14 activate
 exit-address-family
exit
!
