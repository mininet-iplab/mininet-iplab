frr version 8.5.4
frr defaults traditional
hostname r34
service integrated-vtysh-config
!
ip prefix-list AS65003-NETWORKS permit 172.18.1.0/24
ip prefix-list CLIENT-NETWORKS permit 0.0.0.0/0 le 24
!
route-map EXPORT-TO-EBGP permit 10
 match ip address prefix-list CLIENT-NETWORKS
exit
!
route-map IMPORT-FROM-EBGP permit 10
 match ip address prefix-list CLIENT-NETWORKS
 set local-preference 100
exit
!
router ospf
 ospf router-id 172.18.1.34
 network 172.18.1.34/32 area 0
 network 10.3.2.0/30 area 0
 network 10.3.3.0/30 area 0
exit
!
interface r34-eth0
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 3
exit
!
interface r34-eth1
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 3
exit
!
router bgp 65003
 bgp router-id 172.18.1.34
 timers bgp 1 3
 no bgp default ipv4-unicast
 neighbor 172.18.1.31 remote-as 65003
 neighbor 172.18.1.31 update-source lo
 neighbor 172.18.1.31 timers connect 1
 neighbor 172.18.1.32 remote-as 65003
 neighbor 172.18.1.32 update-source lo
 neighbor 172.18.1.32 timers connect 1
 neighbor 172.18.1.33 remote-as 65003
 neighbor 172.18.1.33 update-source lo
 neighbor 172.18.1.33 timers connect 1
 neighbor 10.0.2.2 remote-as 65002
 neighbor 10.0.2.2 timers connect 1
 neighbor 10.0.2.2 advertisement-interval 0
 !
 address-family ipv4 unicast
  neighbor 172.18.1.31 activate
  neighbor 172.18.1.31 next-hop-self
  neighbor 172.18.1.32 activate
  neighbor 172.18.1.32 next-hop-self
  neighbor 172.18.1.33 activate
  neighbor 172.18.1.33 next-hop-self
  neighbor 10.0.2.2 activate
  neighbor 10.0.2.2 soft-reconfiguration inbound
  neighbor 10.0.2.2 route-map IMPORT-FROM-EBGP in
  neighbor 10.0.2.2 route-map EXPORT-TO-EBGP out
 exit-address-family
exit
!
