frr version 8.5.4
frr defaults traditional
hostname r12
service integrated-vtysh-config
!
router ospf
 ospf router-id 172.16.1.12
 network 172.16.1.12/32 area 0
 network 10.1.1.0/30 area 0
 network 10.1.2.0/30 area 0
 network 172.16.1.0/24 area 0
exit
!
interface r12-eth1
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 3
exit
!
interface r12-eth2
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 3
exit
!
router bgp 65001
 bgp router-id 172.16.1.12
 timers bgp 1 3
 no bgp default ipv4-unicast
 neighbor 172.16.1.11 remote-as 65001
 neighbor 172.16.1.11 update-source lo
 neighbor 172.16.1.11 timers connect 1
 neighbor 172.16.1.13 remote-as 65001
 neighbor 172.16.1.13 update-source lo
 neighbor 172.16.1.13 timers connect 1
 neighbor 172.16.1.14 remote-as 65001
 neighbor 172.16.1.14 update-source lo
 neighbor 172.16.1.14 timers connect 1
 !
 address-family ipv4 unicast
  neighbor 172.16.1.11 activate
  neighbor 172.16.1.13 activate
  neighbor 172.16.1.14 activate
  network 172.16.1.0/24
 exit-address-family
exit
!
