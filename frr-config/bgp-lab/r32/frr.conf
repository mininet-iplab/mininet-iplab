frr version 8.5.4
frr defaults traditional
hostname r32
service integrated-vtysh-config
!
router ospf
 ospf router-id 172.18.1.32
 network 172.18.1.32/32 area 0
 network 10.3.1.0/30 area 0
 network 10.3.2.0/30 area 0
exit
!
interface r32-eth0
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 3
exit
!
interface r32-eth1
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 3
exit
!
router bgp 65003
 bgp router-id 172.18.1.32
 timers bgp 1 3
 no bgp default ipv4-unicast
 neighbor 172.18.1.31 remote-as 65003
 neighbor 172.18.1.31 update-source lo
 neighbor 172.18.1.31 timers connect 1
 neighbor 172.18.1.33 remote-as 65003
 neighbor 172.18.1.33 update-source lo
 neighbor 172.18.1.33 timers connect 1
 neighbor 172.18.1.34 remote-as 65003
 neighbor 172.18.1.34 update-source lo
 neighbor 172.18.1.34 timers connect 1
 !
 address-family ipv4 unicast
  neighbor 172.18.1.31 activate
  neighbor 172.18.1.33 activate
  neighbor 172.18.1.34 activate
 exit-address-family
exit
!
