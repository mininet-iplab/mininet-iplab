!
frr version 8.1
frr defaults traditional
hostname r2
!
! Interface configurations
interface r2-eth0
 description Connection to s2 (Region 2 switch)
 ip ospf hello-interval 1
 ip ospf dead-interval 3
 ip ospf priority 255
exit
!
interface r2-eth1
 description Backbone to r1
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 3
exit
!
interface r2-eth2
 description Backbone to r3
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 3
exit
!
! Router ID
router ospf
 ospf router-id 2.2.2.2
 !
 ! Area 0 (Backbone) networks
 network 10.10.1.0/30 area 0
 network 10.10.3.0/30 area 0
 !
 ! Area 2 (Region 2) networks
 network 172.17.0.0/24 area 2
 !
 ! Area range for summarization
 area 2 range 172.17.0.0/22
exit
!
!
line vty
!
