!
frr version 8.1
frr defaults traditional
hostname r12
!
! Interface configurations
interface r12-eth0
 description Connection to s1 (Region 1 switch)
 ip ospf hello-interval 1
 ip ospf dead-interval 3
 ip ospf priority 0
exit
!
interface r12-eth1
 description Client network c12
 ip ospf hello-interval 1
 ip ospf dead-interval 3
exit
!
! Router ID
router ospf
 ospf router-id 1.1.1.12
 !
 ! Area 1 (Region 1) networks
 network 172.16.0.0/24 area 1
 network 172.16.2.0/24 area 1
 !
 ! Passive interface for client network
 passive-interface r12-eth1
exit
!
!
line vty
!
