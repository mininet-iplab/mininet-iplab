!
frr version 8.1
frr defaults traditional
hostname r31
!
! Interface configurations
interface r31-eth0
 description Connection to s3 (Region 3 switch)
 ip ospf hello-interval 1
 ip ospf dead-interval 3
 ip ospf priority 0
exit
!
interface r31-eth1
 description Client network c31
 ip ospf hello-interval 1
 ip ospf dead-interval 3
exit
!
! Router ID
router ospf
 ospf router-id 3.3.3.31
 !
 ! Area 3 (Region 3) networks
 network 172.18.0.0/24 area 3
 network 172.18.1.0/24 area 3
 !
 ! Passive interface for client network
 passive-interface r31-eth1
exit
!
!
line vty
!
