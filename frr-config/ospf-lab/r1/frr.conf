!
frr version 8.1
frr defaults traditional
hostname r1
!
! Interface configurations
interface r1-eth0
 description Connection to s1 (Region 1 switch)
 ip ospf hello-interval 1
 ip ospf dead-interval 3
 ip ospf priority 255
exit
!
interface r1-eth1
 description Backbone to r2
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 3
exit
!
interface r1-eth2
 description Backbone to r3
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 3
exit
!
! Router ID
router ospf
 ospf router-id 1.1.1.1
 !
 ! Area 0 (Backbone) networks
 network 10.10.1.0/30 area 0
 network 10.10.2.0/30 area 0
 !
 ! Area 1 (Region 1) networks
 network 172.16.0.0/24 area 1
 !
 ! Area range for summarization
 area 1 range 172.16.0.0/22
exit
!
!
line vty
!
