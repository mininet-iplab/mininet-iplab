!
frr version 8.1
frr defaults traditional
hostname r3
!
! Interface configurations
interface r3-eth0
 description Connection to s3 (Region 3 switch)
 ip ospf hello-interval 1
 ip ospf dead-interval 3
 ip ospf priority 255
exit
!
interface r3-eth1
 description Backbone to r1
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 3
exit
!
interface r3-eth2
 description Backbone to r2
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 3
exit
!
! Router ID
router ospf
 ospf router-id 3.3.3.3
 !
 ! Area 0 (Backbone) networks
 network 10.10.2.0/30 area 0
 network 10.10.3.0/30 area 0
 !
 ! Area 3 (Region 3) networks
 network 172.18.0.0/24 area 3
 !
 ! Area range for summarization
 area 3 range 172.18.0.0/22
exit
!
!
line vty
!
