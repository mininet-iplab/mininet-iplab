!
frr version 8.1
frr defaults traditional
hostname r21
!
! Interface configurations
interface r21-eth0
 description Connection to s2 (Region 2 switch)
 ip ospf hello-interval 1
 ip ospf dead-interval 3
 ip ospf priority 0
exit
!
interface r21-eth1
 description Client network c21
 ip ospf hello-interval 1
 ip ospf dead-interval 3
exit
!
! Router ID
router ospf
 ospf router-id 2.2.2.21
 !
 ! Area 2 (Region 2) networks
 network 172.17.0.0/24 area 2
 network 172.17.1.0/24 area 2
 !
 ! Passive interface for client network
 passive-interface r21-eth1
exit
!
!
line vty
!
