frr version 10.5.1
frr defaults traditional
hostname r12
service integrated-vtysh-config
!
interface r12-eth0
 ip ospf bfd
 ip ospf dead-interval 3
 ip ospf hello-interval 1
exit
!
interface r12-eth1
 ip ospf bfd
 ip ospf dead-interval 3
 ip ospf hello-interval 1
exit
!
router ospf
 ospf router-id 192.0.2.12
 network 10.10.1.0/30 area 0
 network 10.10.2.0/30 area 0
 network 192.0.2.12/32 area 0
 network 192.168.12.0/24 area 0
 timers throttle spf 50 100 5000
 timers throttle lsa all 50
 timers lsa min-arrival 50
exit
!
bfd
exit
!
