frr version 10.5.1
frr defaults traditional
hostname r21
service integrated-vtysh-config
!
interface r21-eth0
 ip ospf bfd
 ip ospf dead-interval 3
 ip ospf hello-interval 1
exit
!
interface r21-eth1
 ip ospf bfd
 ip ospf dead-interval 3
 ip ospf hello-interval 1
exit
!
router ospf
 ospf router-id 192.0.2.21
 network 10.20.0.0/30 area 0
 network 10.20.2.0/30 area 0
 network 192.0.2.21/32 area 0
 network 192.168.21.0/24 area 0
 timers throttle spf 50 100 5000
 timers throttle lsa all 50
 timers lsa min-arrival 50
exit
!
bfd
exit
!
