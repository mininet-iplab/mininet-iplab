frr version 10.5.1
frr defaults traditional
hostname r2
service integrated-vtysh-config
!
ip prefix-list ANY seq 5 permit 0.0.0.0/0 le 24
!
route-map ALLOW-ALL permit 10
 match ip address prefix-list ANY
exit
!
interface r2-eth1
 ip ospf bfd
 ip ospf dead-interval 3
 ip ospf hello-interval 1
exit
!
interface r2-eth2
 ip ospf bfd
 ip ospf dead-interval 3
 ip ospf hello-interval 1
exit
!
router bgp 65020
 bgp router-id 192.0.2.2
 timers bgp 1 3
 neighbor 203.0.113.17 remote-as 65002
 neighbor 203.0.113.17 timers connect 1
 neighbor 203.0.113.17 advertisement-interval 0
 !
 address-family ipv4 unicast
  network 192.168.21.0/24
  network 192.168.22.0/24
  neighbor 203.0.113.17 route-map ALLOW-ALL in
  neighbor 203.0.113.17 route-map ALLOW-ALL out
 exit-address-family
exit
!
router ospf
 ospf router-id 192.0.2.2
 network 10.20.0.0/30 area 0
 network 10.20.1.0/30 area 0
 network 192.0.2.2/32 area 0
 default-information originate always
 timers throttle spf 50 100 5000
 timers throttle lsa all 50
 timers lsa min-arrival 50
exit
!
bfd
exit
!
