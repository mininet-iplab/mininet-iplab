frr version 10.5.1
frr defaults traditional
hostname isp1
service integrated-vtysh-config
!
ip prefix-list ANY seq 5 permit 0.0.0.0/0 le 24
route-map ALLOW-ALL permit 10
 match ip address prefix-list ANY
exit
!
bgp as-path access-list CUSTOMER-ONLY permit _65010_
!
route-map PEER-ISP-OUT permit 10
 match as-path CUSTOMER-ONLY
exit
!
router bgp 65001
 bgp router-id 203.0.113.100
 timers bgp 1 3
 neighbor 203.0.113.0 remote-as 4200
 neighbor 203.0.113.0 description "tr1 upstream"
 neighbor 203.0.113.0 timers connect 1
 neighbor 203.0.113.0 advertisement-interval 0
 neighbor 203.0.113.9 remote-as 65002
 neighbor 203.0.113.9 description "isp2 peer"
 neighbor 203.0.113.9 timers connect 1
 neighbor 203.0.113.9 advertisement-interval 0
 neighbor 203.0.113.12 remote-as 65010
 neighbor 203.0.113.12 description "r1 cust"
 neighbor 203.0.113.12 timers connect 1
 neighbor 203.0.113.12 advertisement-interval 0
 !
 address-family ipv4 unicast
  neighbor 203.0.113.0 route-map ALLOW-ALL in
  neighbor 203.0.113.0 route-map PEER-ISP-OUT out
  neighbor 203.0.113.9 route-map ALLOW-ALL in
  neighbor 203.0.113.9 route-map PEER-ISP-OUT out
  neighbor 203.0.113.12 default-originate
  neighbor 203.0.113.12 route-map ALLOW-ALL in
  neighbor 203.0.113.12 route-map ALLOW-ALL out
 exit-address-family
exit
!
