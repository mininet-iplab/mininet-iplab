frr version 10.5.1
frr defaults traditional
hostname isp2
service integrated-vtysh-config
!
ip prefix-list ANY seq 5 permit 0.0.0.0/0 le 24
route-map ALLOW-ALL permit 10
 match ip address prefix-list ANY
exit
!
bgp as-path access-list CUSTOMER-ONLY permit _65020_
!
route-map PEER-ISP-OUT permit 10
 match as-path CUSTOMER-ONLY
exit
!
router bgp 65002
 bgp router-id 203.0.113.200
 timers bgp 1 3
 neighbor 203.0.113.4 remote-as 4201
 neighbor 203.0.113.4 description "tr2 upstream"
 neighbor 203.0.113.4 timers connect 1
 neighbor 203.0.113.4 advertisement-interval 0
 neighbor 203.0.113.8 remote-as 65001
 neighbor 203.0.113.8 description "isp1 peer"
 neighbor 203.0.113.8 timers connect 1
 neighbor 203.0.113.8 advertisement-interval 0
 neighbor 203.0.113.16 remote-as 65020
 neighbor 203.0.113.16 description "r2 cust"
 neighbor 203.0.113.16 timers connect 1
 neighbor 203.0.113.16 advertisement-interval 0
 !
 address-family ipv4 unicast
  neighbor 203.0.113.4 route-map ALLOW-ALL in
  neighbor 203.0.113.4 route-map PEER-ISP-OUT out
  neighbor 203.0.113.8 route-map ALLOW-ALL in
  neighbor 203.0.113.8 route-map PEER-ISP-OUT out
  neighbor 203.0.113.16 default-originate
  neighbor 203.0.113.16 route-map ALLOW-ALL in
  neighbor 203.0.113.16 route-map ALLOW-ALL out
 exit-address-family
exit
!
