frr version 10.5.1
frr defaults traditional
hostname r1
service integrated-vtysh-config
!
ip prefix-list ANY seq 5 permit 0.0.0.0/0 le 24
!
route-map ALLOW-ALL permit 10
 match ip address prefix-list ANY
exit
!
interface r1-eth1
 ip ospf bfd
 ip ospf dead-interval 3
 ip ospf hello-interval 1
exit
!
interface r1-eth2
 ip ospf bfd
 ip ospf dead-interval 3
 ip ospf hello-interval 1
exit
!
router bgp 65010
 bgp router-id 192.0.2.1
 timers bgp 1 3
 neighbor 203.0.113.13 remote-as 65001
 neighbor 203.0.113.13 timers connect 1
 neighbor 203.0.113.13 advertisement-interval 0
 !
 address-family ipv4 unicast
  network 192.168.11.0/24
  network 192.168.12.0/24
  neighbor 203.0.113.13 route-map ALLOW-ALL in
  neighbor 203.0.113.13 route-map ALLOW-ALL out
 exit-address-family
exit
!
router ospf
 ospf router-id 192.0.2.1
 network 10.10.0.0/30 area 0
 network 10.10.1.0/30 area 0
 network 192.0.2.1/32 area 0
 default-information originate always
 timers throttle spf 50 100 5000
 timers throttle lsa all 50
 timers lsa min-arrival 50
exit
!
bfd
exit
!
